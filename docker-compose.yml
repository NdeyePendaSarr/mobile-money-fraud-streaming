# SenPay : socle local du projet (phase 1).
# Deux profils, jamais lancés ensemble (PRD §8.4) :
#   streaming : kafka, kafka-init, postgres (puis générateur, Spark, Grafana)
#   batch     : postgres (puis Airflow, Spark batch)
# Aucun service n'est lancé sans profil.

name: mobile-money-fraud-streaming

services:
  kafka:
    image: apache/kafka:4.3.2
    profiles: ["streaming"]
    hostname: kafka
    ports:
      # Listener HOST : générateur et scripts lancés depuis l'hôte (WSL2) ;
      # publié sur 127.0.0.1 seulement, jamais sur le réseau local
      - "127.0.0.1:${SENPAY_KAFKA_HOST_PORT:-9092}:9092"
    environment:
      # KRaft, un seul nœud qui est à la fois broker et contrôleur (pas de ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Identifiant fixe du cluster : le volume formaté est réutilisé d'un « up » à l'autre
      CLUSTER_ID: vWxR55gbT9Orh6HzgEPB4g
      # INTERNAL : trafic entre conteneurs ; HOST : depuis l'hôte ; CONTROLLER : quorum KRaft
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:${SENPAY_KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Les topics sont créés explicitement par kafka-init, jamais au premier envoi
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Un seul broker : facteur de réplication 1 pour tous les topics internes
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Tas du broker plafonné (budget mémoire, PRD §8.4)
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Vrai appel au broker, pas seulement un port ouvert. KAFKA_HEAP_OPTS est
      # redéfini : sinon l'outil hériterait de -Xms512m et chaque contrôle
      # réserverait 512 Mo de plus dans le conteneur.
      test:
        - CMD-SHELL
        - KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 20s

  kafka-init:
    # Conteneur ponctuel : crée les topics puis s'arrête (code 0 attendu).
    # --if-not-exists rend la commande rejouable à chaque « up ».
    image: apache/kafka:4.3.2
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_HEAP_OPTS: "-Xms32m -Xmx128m"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        # transactions : 3 partitions, clé = sender_id, rétention 7 jours
        $$T --bootstrap-server $$B --create --if-not-exists --topic transactions \
          --partitions 3 --replication-factor 1 --config retention.ms=604800000
        # dead_letter : messages invalides et motif du rejet (phase 6), 7 jours
        $$T --bootstrap-server $$B --create --if-not-exists --topic dead_letter \
          --partitions 1 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server $$B --describe --topic transactions,dead_letter

  postgres:
    image: postgres:17.12
    profiles: ["streaming", "batch"]
    environment:
      # Variables de l'image postgres, alimentées par les variables SENPAY_PG_* de .env
      POSTGRES_USER: ${SENPAY_PG_USER:?SENPAY_PG_USER manquant (copier .env.example en .env)}
      POSTGRES_PASSWORD: ${SENPAY_PG_PASSWORD:?SENPAY_PG_PASSWORD manquant (copier .env.example en .env)}
      POSTGRES_DB: ${SENPAY_PG_DB:?SENPAY_PG_DB manquant (copier .env.example en .env)}
    ports:
      # 5434 sur l'hôte : 5432 = PostgreSQL local de Windows, 5433 = projet 1 ;
      # publié sur 127.0.0.1 seulement
      - "127.0.0.1:${SENPAY_PG_PORT:-5434}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Exécuté une seule fois, à la création du volume (make reset pour le rejouer)
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-streaming:
    # Job Spark Structured Streaming (phase 3, I1). Lancé à part (make stream),
    # pas par make up : le run A démarre le job après coup, sur un arriéré.
    build: streaming/
    image: senpay-spark-streaming:4.2.1
    profiles: ["streaming"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"
    # Limite du conteneur (I7) : Spark ne peut pas prendre toute la mémoire de WSL2
    mem_limit: 3g
    environment:
      # Réseau interne : kafka:29092 et postgres:5432 (aucun port publié)
      SENPAY_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SENPAY_PG_HOST: postgres
      SENPAY_PG_PORT: "5432"
      SENPAY_PG_USER: ${SENPAY_PG_USER:?SENPAY_PG_USER manquant (copier .env.example en .env)}
      SENPAY_PG_PASSWORD: ${SENPAY_PG_PASSWORD:?SENPAY_PG_PASSWORD manquant (copier .env.example en .env)}
      SENPAY_PG_DB: ${SENPAY_PG_DB:?SENPAY_PG_DB manquant (copier .env.example en .env)}
      SENPAY_CHECKPOINT_DIR: /opt/spark-checkpoints/transactions
      SENPAY_RULES_CONFIG: /opt/app/config/rules.toml
    volumes:
      # Code du job et seuils des règles en lecture seule ; cache Ivy et checkpoint
      # dans des volumes nommés
      - ./streaming:/opt/app/streaming:ro
      - ./config/rules.toml:/opt/app/config/rules.toml:ro
      - spark_ivy:/opt/spark-ivy
      - spark_checkpoints:/opt/spark-checkpoints
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - local[4]
      - --driver-memory
      - 2g
      # Coordonnées épinglées (I2) : dépendances transitives résolues par Ivy
      - --conf
      - spark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.1,org.postgresql:postgresql:42.7.14
      - --conf
      - spark.jars.ivy=/opt/spark-ivy
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.sql.session.timeZone=Africa/Dakar
      - --conf
      - spark.ui.enabled=false
      - /opt/app/streaming/job.py

volumes:
  kafka_data:
  pg_data:
  # Supprimés par make reset (down -v) : le checkpoint ne survit jamais à un reset (I6)
  spark_ivy:
  spark_checkpoints:
